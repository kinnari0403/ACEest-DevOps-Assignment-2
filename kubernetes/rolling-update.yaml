apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-rolling
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness-rolling
  template:
    metadata:
      labels:
        app: aceest-fitness-rolling
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:v1.0
          ports:
            - containerPort: 5000
