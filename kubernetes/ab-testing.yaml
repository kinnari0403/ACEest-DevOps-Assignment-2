apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-version-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: a
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: a
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:v1.0
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
